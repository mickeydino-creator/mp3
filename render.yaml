services:
  # Self-hosted Proof-of-Origin token provider (see README > "If conversions
  # fail..."). Mints real PO tokens by running YouTube's own BotGuard JS, so
  # yt-dlp can get real download formats from cloud IPs without needing a
  # personal account's cookies. Private service: only reachable from other
  # services in this Render project, not from the public internet.
  - type: pserv
    name: convertly-potoken
    runtime: image
    image:
      url: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest
    plan: starter

  - type: web
    name: convertly-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        value: https://convertly-client.onrender.com
      - key: PORT
        value: 4000
      - key: POT_PROVIDER_URL
        value: http://convertly-potoken:4416

  - type: web
    name: convertly-client
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: client
    envVars:
      - key: VITE_API_BASE_URL
        value: https://convertly-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
