services:
  - type: web
    name: convertly-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        value: https://convertly-client.onrender.com
      - key: PORT
        value: 4000
      # POT_PROVIDER_URL is not set here on purpose: server/Dockerfile runs
      # the PO token provider as a second process inside this same
      # container (see start.sh) and defaults POT_PROVIDER_URL to it, so no
      # extra paid service is needed.

  - type: web
    name: convertly-client
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: client
    envVars:
      - key: VITE_API_BASE_URL
        value: https://convertly-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
