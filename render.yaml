services:
  - type: web
    name: convertly-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        value: https://convertly-client.onrender.com
      - key: PORT
        value: 4000

  - type: web
    name: convertly-client
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: client
    envVars:
      - key: VITE_API_BASE_URL
        value: https://convertly-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
